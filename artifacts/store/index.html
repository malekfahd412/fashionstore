<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5" />
    <title>Velora — Premium Fashion Store</title>
    <meta name="description" content="Discover the finest fashion collections at Velora. Shop dresses, abayas, tops, jeans and accessories. Bilingual Arabic/English luxury fashion store." />
    <meta name="keywords" content="fashion, luxury, abayas, dresses, women fashion, Arabic fashion, Velora" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#065f46" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Velora" />
    <meta property="og:title" content="Velora — Premium Fashion Store" />
    <meta property="og:description" content="Discover the finest fashion collections at Velora. Shop dresses, abayas, tops, jeans and accessories." />
    <meta property="og:image" content="https://images.unsplash.com/photo-1490481651871-ab68de25d43d?w=1200&h=630&fit=crop" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="ar_SA" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Velora — Premium Fashion Store" />
    <meta name="twitter:description" content="Discover the finest fashion collections at Velora." />
    <meta name="twitter:image" content="https://images.unsplash.com/photo-1490481651871-ab68de25d43d?w=1200&h=630&fit=crop" />

    <!-- Structured Data: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ClothingStore",
      "name": "Velora",
      "description": "Premium bilingual Arabic/English fashion store",
      "url": "/",
      "logo": "/favicon.svg",
      "inLanguage": ["en", "ar"],
      "offers": {
        "@type": "AggregateOffer",
        "priceCurrency": "SAR"
      }
    }
    </script>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
