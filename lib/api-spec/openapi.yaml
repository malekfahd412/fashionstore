  # ── Admin security ─────────────────────────────────────────────────────
  /admin/security/overview:
    get:
      operationId: getSecurityOverview
      tags: [admin]
      summary: Security overview metrics (admin only)
      responses:
        "200":
          description: Security overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecurityOverview"

  /admin/security/locked-accounts:
    get:
      operationId: getLockedAccounts
      tags: [admin]
      summary: List locked accounts (admin only)
      responses:
        "200":
          description: Locked accounts
          content:
            application/json:
              schema:
                type: object
                properties:
                  accounts:
                    type: array
                    items:
                      $ref: "#/components/schemas/LockedAccount"

  /admin/security/login-history:
    get:
      operationId: getLoginHistory
      tags: [admin]
      summary: Login attempt history (admin only)
      parameters:
        - name: email
          in: query
          schema:
            type: string
        - name: ip
          in: query
          schema:
            type: string
        - name: success
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Login history entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginHistoryList"

  /admin/security/suspicious-activity:
    get:
      operationId: getSuspiciousActivity
      tags: [admin]
      summary: Suspicious IP and email activity (admin only)
      responses:
        "200":
          description: Suspicious activity report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuspiciousActivity"

  /admin/security/unlock:
    post:
      operationId: unlockAccount
      tags: [admin]
      summary: Unlock a locked account or IP (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnlockInput"
      responses:
        "200":
          description: Account unlocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /admin/security/compromised-accounts:
    get:
      operationId: getCompromisedAccounts
      tags: [admin]
