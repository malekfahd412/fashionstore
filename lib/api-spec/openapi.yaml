                  $ref: "#/components/schemas/TopCategory"

  /analytics/vendor-performance:
    get:
      operationId: getVendorPerformance
      tags: [analytics]
      summary: Vendor performance breakdown (admin only)
      responses:
        "200":
          description: Vendor performance rows
          content:
            application/json:
              schema:
                type: array
