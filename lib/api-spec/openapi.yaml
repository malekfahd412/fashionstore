components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required: [message]

    # ── Auth ───────────────────────────────────────────────────────────
    RegisterInput:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
        email:
          type: string
        password:
          type: string
        role:
          type: string

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string
        rememberDevice:
          type: boolean
          description: When true, the device is saved as trusted so future logins from it skip new-device alerts.

    AuthResult:
      type: object
      required: [token, refreshToken, user]
      properties:
        token:
          type: string
        refreshToken:
          type: string
        user:
          $ref: "#/components/schemas/User"

    RefreshInput:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    RefreshResult:
      type: object
      required: [token, refreshToken]
      properties:
        token:
          type: string
        refreshToken:
          type: string

    # ── User ───────────────────────────────────────────────────────────
    User:
      type: object
      required: [id, name, email, role, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        role:
          type: string
        avatar:
          type: ["string", "null"]
        createdAt:
          type: string

    UserUpdate:
      type: object
      properties:
        name:
          type: string
        avatar:
          type: string
        role:
          type: string
        active:
          type: boolean

    UserListResponse:
      type: object
      required: [users, total, page, limit]
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/User"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    # ── Category ───────────────────────────────────────────────────────
    Category:
      type: object
      required: [id, nameEn, nameAr]
      properties:
        id:
          type: integer
        nameEn:
          type: string
        nameAr:
          type: string
        slug:
          type: string
        imageUrl:
          type: ["string", "null"]
        parentCategoryId:
          type: ["integer", "null"]
        productCount:
          type: integer

    CategoryInput:
      type: object
      required: [nameEn, nameAr]
      properties:
        nameEn:
          type: string
        nameAr:
          type: string
        slug:
          type: string
        imageUrl:
          type: string
        parentCategoryId:
          type: ["integer", "null"]

    CategoryUpdate:
      type: object
      properties:
        nameEn:
          type: string
        nameAr:
          type: string
        slug:
          type: string
        imageUrl:
          type: string
        parentCategoryId:
          type: ["integer", "null"]

    # ── Product ────────────────────────────────────────────────────────
    ProductVariant:
      type: object
      required: [id, color, size, stockQuantity]
      properties:
        id:
          type: integer
        color:
          type: string
        size:
          type: string
        stockQuantity:
          type: integer

    ProductImage:
      type: object
      required: [id, imageUrl, isPrimary]
      properties:
        id:
          type: integer
        imageUrl:
          type: string
        isPrimary:
          type: boolean

    Product:
      type: object
      required: [id, nameEn, nameAr, price, categoryId, vendorId, active, createdAt]
      properties:
        id:
          type: integer
        nameEn:
          type: string
        nameAr:
          type: string
        descriptionEn:
          type: ["string", "null"]
        descriptionAr:
          type: ["string", "null"]
        categoryId:
          type: integer
        categoryName:
          type: string
        vendorId:
          type: integer
        vendorName:
          type: string
        price:
          type: number
        salePrice:
          type: ["number", "null"]
        sku:
          type: ["string", "null"]
        featured:
          type: boolean
        active:
          type: boolean
        averageRating:
          type: number
        reviewCount:
          type: integer
        images:
          type: array
          items:
            $ref: "#/components/schemas/ProductImage"
        variants:
          type: array
          items:
            $ref: "#/components/schemas/ProductVariant"
        createdAt:
          type: string

    ProductInput:
      type: object
      required: [nameEn, nameAr, price, categoryId]
      properties:
        nameEn:
          type: string
        nameAr:
          type: string
        descriptionEn:
          type: string
        descriptionAr:
          type: string
        categoryId:
          type: integer
        price:
          type: number
        salePrice:
          type: ["number", "null"]
        sku:
          type: string
        featured:
          type: boolean
        active:
          type: boolean
        images:
          type: array
          items:
            type: string
        variants:
          type: array
          items:
            $ref: "#/components/schemas/VariantInput"

    ProductUpdate:
      type: object
      properties:
        nameEn:
          type: string
        nameAr:
          type: string
        descriptionEn:
          type: string
        descriptionAr:
          type: string
        categoryId:
          type: integer
        price:
          type: number
        salePrice:
          type: ["number", "null"]
        sku:
          type: string
        featured:
          type: boolean
        active:
          type: boolean

    VariantInput:
      type: object
      required: [color, size, stockQuantity]
      properties:
        color:
          type: string
        size:
          type: string
        stockQuantity:
          type: integer

    ProductListResponse:
      type: object
      required: [products, total, page, limit]
      properties:
        products:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    # ── Order ──────────────────────────────────────────────────────────
    OrderItem:
      type: object
      required: [id, productId, productNameEn, productNameAr, quantity, price]
      properties:
        id:
          type: integer
        productId:
          type: integer
        productNameEn:
          type: string
        productNameAr:
          type: string
        imageUrl:
          type: ["string", "null"]
        color:
          type: ["string", "null"]
        size:
          type: ["string", "null"]
        quantity:
          type: integer
        price:
          type: number

    Order:
      type: object
      required: [id, userId, totalPrice, paymentMethod, status, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: integer
        userName:
          type: string
        totalPrice:
          type: number
        paymentMethod:
          type: string
        status:
          type: string
        couponCode:
          type: ["string", "null"]
        discount:
          type: ["number", "null"]
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        createdAt:
          type: string

    OrderInput:
      type: object
      required: [paymentMethod, items]
      properties:
        paymentMethod:
          type: string
        couponCode:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItemInput"

    OrderItemInput:
      type: object
      required: [productVariantId, quantity]
      properties:
        productVariantId:
          type: integer
          minimum: 1
        quantity:
          type: integer
          minimum: 1
          maximum: 100

    OrderStatusUpdate:
      type: object
      required: [status]
      properties:
        status:
          type: string

    OrderListResponse:
      type: object
      required: [orders, total, page, limit]
      properties:
        orders:
          type: array
          items:
            $ref: "#/components/schemas/Order"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    # ── Cart ───────────────────────────────────────────────────────────
    CartItem:
      type: object
      required: [variantId, productId, nameEn, nameAr, price, quantity, color, size]
      properties:
        variantId:
          type: integer
        productId:
          type: integer
        nameEn:
          type: string
        nameAr:
          type: string
        imageUrl:
          type: ["string", "null"]
        price:
          type: number
        salePrice:
          type: ["number", "null"]
        quantity:
          type: integer
        color:
          type: string
        size:
          type: string
        stockQuantity:
          type: integer

    Cart:
      type: object
      required: [items, subtotal, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CartItem"
        subtotal:
          type: number
        discount:
          type: number
        total:
          type: number

    CartItemInput:
      type: object
      required: [variantId, quantity]
      properties:
        variantId:
          type: integer
        quantity:
          type: integer

    CartItemUpdate:
      type: object
      required: [quantity]
      properties:
        quantity:
          type: integer

    # ── Review ─────────────────────────────────────────────────────────
    Review:
      type: object
      required: [id, productId, userId, rating, verifiedPurchase, createdAt, updatedAt]
      properties:
        id:
          type: integer
        productId:
          type: integer
        userId:
          type: integer
        orderId:
          type: ["integer", "null"]
        userName:
          type: string
        userAvatar:
          type: ["string", "null"]
        productNameEn:
          type: ["string", "null"]
        productImageUrl:
          type: ["string", "null"]
        rating:
          type: integer
        title:
          type: ["string", "null"]
        comment:
          type: ["string", "null"]
        verifiedPurchase:
          type: boolean
        createdAt:
          type: string
        updatedAt:
          type: string

    ReviewInput:
      type: object
      required: [rating]
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
        title:
          type: string
          maxLength: 120
        comment:
          type: string
          minLength: 10
          maxLength: 2000
        orderId:
          type: integer

    ReviewUpdateInput:
      type: object
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
        title:
          type: string
          maxLength: 120
        comment:
          type: string
          minLength: 10
          maxLength: 2000

    ReviewStats:
      type: object
      required: [averageRating, totalReviews, distribution]
      properties:
        averageRating:
          type: number
        totalReviews:
          type: integer
        distribution:
          type: object
          required: ["1", "2", "3", "4", "5"]
          properties:
            "1":
              type: integer
            "2":
              type: integer
            "3":
              type: integer
            "4":
              type: integer
            "5":
              type: integer

    ProductReviewsResponse:
      type: object
      required: [stats, reviews, total, page, limit]
      properties:
        stats:
          $ref: "#/components/schemas/ReviewStats"
        reviews:
          type: array
          items:
            $ref: "#/components/schemas/Review"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
        canReview:
          type: boolean
        userReview:
          $ref: "#/components/schemas/Review"

    AdminReviewsResponse:
      type: object
      required: [reviews, total, page, limit]
      properties:
        reviews:
          type: array
          items:
            $ref: "#/components/schemas/Review"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    # ── Wishlist ───────────────────────────────────────────────────────
    WishlistItem:
      type: object
      required: [productId, product]
      properties:
        productId:
          type: integer
        product:
          $ref: "#/components/schemas/Product"

    # ── Coupon ─────────────────────────────────────────────────────────
    Coupon:
      type: object
      required: [id, code, discountType, discountValue, active]
      properties:
        id:
          type: integer
        code:
          type: string
        discountType:
          type: string
        discountValue:
          type: number
        startDate:
          type: ["string", "null"]
        endDate:
          type: ["string", "null"]
        usageLimit:
          type: ["integer", "null"]
        usageCount:
          type: integer
        active:
          type: boolean

    CouponInput:
      type: object
      required: [code, discountType, discountValue]
      properties:
        code:
          type: string
        discountType:
          type: string
        discountValue:
          type: number
        startDate:
          type: string
        endDate:
          type: string
        usageLimit:
          type: integer

    CouponUpdate:
      type: object
      properties:
        code:
          type: string
        discountType:
          type: string
        discountValue:
          type: number
        startDate:
          type: string
        endDate:
          type: string
        usageLimit:
          type: integer
        active:
          type: boolean

    CouponValidateInput:
      type: object
      required: [code]
      properties:
        code:
          type: string

    # ── Banner ─────────────────────────────────────────────────────────
    Banner:
      type: object
      required: [id, titleEn, titleAr, imageUrl, active, sortOrder]
      properties:
        id:
          type: integer
        titleEn:
          type: string
        titleAr:
          type: string
        subtitleEn:
          type: ["string", "null"]
        subtitleAr:
          type: ["string", "null"]
        imageUrl:
          type: string
        linkUrl:
          type: ["string", "null"]
        active:
          type: boolean
        sortOrder:
          type: integer

    BannerInput:
      type: object
      required: [titleEn, titleAr, imageUrl]
      properties:
        titleEn:
          type: string
        titleAr:
          type: string
        subtitleEn:
          type: string
        subtitleAr:
          type: string
        imageUrl:
          type: string
        linkUrl:
          type: string
        active:
          type: boolean
        sortOrder:
          type: integer

    BannerUpdate:
      type: object
      properties:
        titleEn:
          type: string
        titleAr:
          type: string
