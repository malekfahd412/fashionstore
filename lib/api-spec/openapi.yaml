      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddressInput"
      responses:
        "201":
          description: Created address
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserAddress"

  /addresses/{id}:
    patch:
      operationId: updateAddress
      tags: [addresses]
      summary: Update a saved address
      parameters:
        - name: id
          in: path
