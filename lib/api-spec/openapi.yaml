                  $ref: "#/components/schemas/VendorPerformanceRow"

  # ── Banners (admin: list all including inactive) ───────────────────────
  /banners/all:
    get:
      operationId: listAllBanners
      tags: [banners]
      summary: List all banners including inactive (admin only)
      responses:
        "200":
          description: All banners
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Banner"

  # ── Audit logs ─────────────────────────────────────────────────────────
  /admin/audit-logs:
    get:
      operationId: listAuditLogs
      tags: [admin]
      summary: List admin audit log entries (admin only)
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: resource
          in: query
          schema:
            type: string
        - name: action
          in: query
          schema:
            type: string
        - name: userId
          in: query
          schema:
            type: integer
        - name: from
          in: query
          schema:
            type: string
        - name: to
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Audit log entries
          content:
            application/json:
